version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres-lab18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nestjs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: my-nest-app-optimized
    container_name: nestjs-app-lab18
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:          # ← ЭТО БЫЛО ПРОПУЩЕНО!
      - nestjs-network # ← ЭТО БЫЛО ПРОПУЩЕНО!

volumes:
  pgdata:

networks:
  nestjs-network:
    driver: bridge